# cargo-deny policy (AGE-829). Run: cargo deny check

[graph]
all-features = true

[advisories]
yanked = "deny"
# Every entry below is tracked by AGE-829; delete an entry when its cause is gone.
ignore = [
    # async-std: unmaintained, no patched release; replace or wait for upstream
    "RUSTSEC-2025-0052",
    # bincode: unmaintained, no patched release; replace or wait for upstream
    "RUSTSEC-2025-0141",
    # fxhash: unmaintained, no patched release; replace or wait for upstream
    "RUSTSEC-2025-0057",
    # instant: unmaintained, no patched release; replace or wait for upstream
    "RUSTSEC-2024-0384",
    # lopdf: lopdf 0.39 pinned by memvid-core
    "RUSTSEC-2026-0187",
    # paste: unmaintained, no patched release; replace or wait for upstream
    "RUSTSEC-2024-0436",
    # proc-macro-error2: unmaintained, no patched release; replace or wait for upstream
    "RUSTSEC-2026-0173",
    # quick-xml: old quick-xml pinned by upstream crates (calamine, memvid-core, docx-rs, citationberg, plist, pptx)
    "RUSTSEC-2026-0194",
    "RUSTSEC-2026-0195",
    # rkyv: rkyv 0.7 pinned by mitex-spec (typst)
    "RUSTSEC-2026-0235",
    # rustls-pemfile: unmaintained, no patched release; replace or wait for upstream
    "RUSTSEC-2025-0134",
    # rustybuzz: unmaintained, no patched release; replace or wait for upstream
    "RUSTSEC-2026-0206",
    # ttf-parser: unmaintained, no patched release; replace or wait for upstream
    "RUSTSEC-2026-0192",
    # yaml-rust: unmaintained, no patched release; replace or wait for upstream
    "RUSTSEC-2024-0320",
    # unsafe-libyaml: unmaintained, no patched release; pulled in by typst (hayagriva -> serde_yaml)
    "RUSTSEC-2024-0449",
    # zstd 0.13 / zstd-safe 7: pinned by memvid-core (fixed in zstd 0.14.3 / zstd-safe 8.2.0, which the rest of the tree already uses)
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
    # zip < 9: extract() follows symlinks / keeps SUID bits. chatty's own extract() uses zip 9;
    # the older versions are pinned by calamine, docx-rs, memvid-core, pptx and the rdocx fork,
    # which read office documents in memory and do not extract to disk
    "RUSTSEC-2026-0367",
    "RUSTSEC-2026-0368",
    "RUSTSEC-2026-0369",
    # zvariant / zvariant_derive / zbus_names: unmaintained, no patched release; pulled in by keyring (zbus, Linux secret service)
    "RUSTSEC-2026-0370",
    "RUSTSEC-2026-0371",
    "RUSTSEC-2026-0372",
]

[licenses]
# Allow-list taken from the licenses actually present in the tree. Copyleft
# alternatives (GPL-2.0-only in ittapi/self_cell, LGPL-2.1-or-later in r-efi) are
# only ever the "OR" side of a dual license and are deliberately not allowed.
allow = [
    "0BSD",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-1-Clause",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "BSL-1.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "MIT-0",
    "MPL-2.0",
    "NCSA",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
    "bzip2-1.0.6",
    "zlib-acknowledgement",
]
confidence-threshold = 0.8

# First-party (MIT, see LICENSE) crates carry no `license` field in their manifests. Clarify them so the
# license gate stays strict for everything else.

[[licenses.clarify]]
crate = "chatty-core"
expression = "MIT"
license-files = []

[[licenses.clarify]]
crate = "chatty-fabric"
expression = "MIT"
license-files = []

