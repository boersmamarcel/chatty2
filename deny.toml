[bans]
multiple-versions = "warn"
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
# Fork carrying the slide-rendering fixes (AGE-343, rev-pinned in Cargo.toml).
allow-git = ["https://github.com/boersmamarcel/rdocx"]

