[workspace]
members = [
    "crates/chatty-core",
    "crates/chatty-gpui",
    "crates/chatty-tui",
    "crates/chatty-wasm-runtime",
    "crates/chatty-module-registry",
    "crates/chatty-protocol-gateway",
    "crates/hive-client",
    # Research / self-improving agent crates (AGE-5 / AGE-26); Stage B → harbor-chatty
    "crates/chatty-trace",
    "crates/chatty-playbook",
    "crates/chatty-flow",
    "crates/chatty-optimize",
]
resolver = "2"

[workspace.package]
version = "0.3.41"
edition = "2024"
# AGE-26: declared MSRV for shipping research crates (also per-crate rust-version).
rust-version = "1.95"

[workspace.dependencies]
# Core agent dependencies (rig 0.42 crate family — AGE-32 / AGE-26 exact-minor pins)
rig-core = "=0.42.0"
rig-agent = { version = "=0.42.0", features = ["derive"] }
rig-mcp = "=0.2.5"
# Trace capture for AGE-5 / walking skeleton — pinned now, wired later.
rig-tap = "=0.3.0"
# rig-agent's `rmcp` feature requires rmcp ^2 (was 1.4 under rig-core 0.37).
# Pin 2.1.0: 2.2.0 calls SseStream::from_bytes_stream which does not exist on
# sse-stream 0.2.x (the method is from_byte_stream).
rmcp = { version = "=2.1.0", features = ["client", "macros", "transport-streamable-http-client-reqwest", "auth"] }

# Persistence layer
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "fs", "macros", "process", "io-util"] }
sqlx = { version = "0.9.0", features = ["runtime-tokio", "sqlite"] }
dirs = "6.0"
uuid = { version = "1.23.0", features = ["v4"] }

# Docker sandbox
bollard = "0.21"
async-trait = "0.1"

# Chat functionality
futures = "0.3"
anyhow = "1.0"
regex = "1.12.3"
base64 = "0.22"
async-stream = "0.3"
reqwest = { version = "0.13.2", default-features = false, features = ["rustls", "json", "stream", "query"] }
glob = "0.3"
similar = "3.2.0"

# Auto-updater
semver = "1.0"
tempfile = "3.10"
flate2 = "1.0"
tar = "0.4"
sha2 = "0.11"
hex = "0.4"
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
percent-encoding = "2"

# Date/time formatting
chrono = { version = "0.4", default-features = false, features = ["std"] }

# Mutex without poisoning
parking_lot = "0.12"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
thiserror = "2.0"

# Azure authentication (AGE-122: 0.20 → 1.x; DefaultAzureCredential removed in 1.0)
azure_identity = { version = "1.0.0", features = ["tokio"] }
azure_core = "1.1.0"

# Asset embedding
rust-embed = "8.12.0"

# PDF and image
pdfium-render = "0.9.0"
image = "0.25"

# Excel
calamine = "0.36.1"
rust_xlsxwriter = "0.99.0"
umya-spreadsheet = "3.1.0"

# DOCX (Word documents)
docx-rs = "0.4.20"

# PPTX (PowerPoint) — ZIP+XML read support plus `pptx` crate write support
zip = "8"
roxmltree = "0.21"
pptx_writer = { package = "pptx", version = "0.1.0" }

# DuckDB — 1.10504+ bundles DuckDB 1.5.4, which builds on MSVC 14.51
# (VS 2026 / GitHub windows-latest). Older bundled fmt still references
# the removed stdext::checked_array_iterator.
duckdb = { version = "~1.10504.0", features = ["parquet", "json", "bundled"] }

# Math rendering
typst = "0.15.1"
typst-svg = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"
mitex = "0.2.4"
typst-assets = { version = "0.15.1", features = ["fonts"] }
comemo = "0.5.1"

# Mermaid / SVG
mermaid-rs-renderer = { version = "0.2", default-features = false }
resvg = "0.47.0"
usvg = "0.47.0"

# Syntax highlighting
# Pinned to match gpui-component's required version (=2.0.0-beta.1).
ropey = { version = "=2.0.0-beta.1", features = ["metric_lines_lf", "metric_utf16"] }

# Token counting
tiktoken-rs = "0.12.0"

# Agent memory
memvid-core = { version = "2.0.139", default-features = false, features = ["lex", "temporal_track"] }

# Browser control (AGE-142 / AGE-152) — CDP client over the generated protocol types.
# 0.9.1 lines up with the workspace pins (tokio 1, reqwest 0.13, thiserror 2, serde 1).
chromiumoxide = "0.9.1"
# Locating an installed Chrome on PATH (also a chromiumoxide dep, kept in sync).
which = "8"

# GPUI (UI only)
gpui = "0.2.2"
gpui-component = { version = "0.5.1", features = ["tree-sitter-languages"] }
gpui-component-assets = "0.5.1"

# TUI framework
ratatui = "0.30.0"
crossterm = { version = "0.29.0", features = ["event-stream"] }
tui-textarea = { package = "tui-textarea-2", version = "0.13.2" }
clap = { version = "4.6.0", features = ["derive"] }

# Unix-specific
nix = { version = "0.31.3", features = ["signal"] }
