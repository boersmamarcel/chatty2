[package]
name = "chatty-tui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "chatty-tui"
path = "src/main.rs"

[dependencies]
chatty-core = { path = "../chatty-core", features = ["excel", "pdf", "duckdb"] }
chatty-module-registry = { path = "../chatty-module-registry" }
chatty-wasm-runtime = { path = "../chatty-wasm-runtime" }
# Participant mode (AGE-301): the broker socket's frames and its client half.
# Already in the graph via chatty-module-registry / chatty-wasm-runtime; this
# adds axum and tower-http, not wasmtime.
chatty-protocol-gateway = { path = "../chatty-protocol-gateway", features = ["worker"] }
# `--broker` (AGE-376): a headless/pipe/interactive leader runs its own
# `ProtocolGateway` so it can delegate to `local-agent`, the same way the
# desktop's module-settings controller does.
axum = "0.8"
# `chatty-tui acp` (ADR-0013, AGE-414): the Agent Client Protocol server an
# editor such as Zed (or Harbor's ACP runner) drives over stdio.
agent-client-protocol = "2.2"

# LLM framework (needed for rig types used in chatty-core's API)
rig-core.workspace = true
rig-agent.workspace = true

# TUI framework
ratatui.workspace = true
crossterm.workspace = true
tui-textarea.workspace = true
clap.workspace = true

# Async runtime. `signal`: `--usage-file` writes its last object on SIGINT/SIGTERM.
tokio = { workspace = true, features = ["signal"] }
futures.workspace = true

# Utilities
anyhow.workspace = true
dirs.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

# `--usage-file` restores a signal's default action and re-raises it after
# writing, so the exit status is the one the signal would have given.
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
# Scripted stream fixtures shared with chatty-gpui's characterization tests.
chatty-core = { path = "../chatty-core", features = ["test-support"] }
parking_lot.workspace = true
# AGE-306's chain test puts the participant socket in a temp dir.
tempfile.workspace = true

[features]
default = ["mcp"]
mcp = ["chatty-core/mcp"]
