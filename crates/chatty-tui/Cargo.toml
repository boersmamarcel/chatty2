[package]
name = "chatty-tui"
version.workspace = true
edition.workspace = true

[[bin]]
name = "chatty-tui"
path = "src/main.rs"

[dependencies]
chatty-core = { path = "../chatty-core", features = ["excel", "pdf", "duckdb"] }
chatty-module-registry = { path = "../chatty-module-registry" }
# Participant mode (AGE-301): the broker socket's frames and its client half.
# Already in the graph via chatty-module-registry / chatty-wasm-runtime; this
# adds axum and tower-http, not wasmtime.
chatty-protocol-gateway = { path = "../chatty-protocol-gateway" }

# LLM framework (needed for rig types used in chatty-core's API)
rig-core.workspace = true
rig-agent.workspace = true

# TUI framework
ratatui.workspace = true
crossterm.workspace = true
tui-textarea.workspace = true
clap.workspace = true

# Async runtime
tokio.workspace = true
futures.workspace = true

# Utilities
anyhow.workspace = true
dirs.workspace = true
uuid.workspace = true
serde.workspace = true
serde_json.workspace = true

# Logging
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Scripted stream fixtures shared with chatty-gpui's characterization tests.
chatty-core = { path = "../chatty-core", features = ["test-support"] }
# AGE-301's A/A check runs a real gateway on a real port, so it needs the
# gateway's own dependencies rather than a stand-in for them.
axum = "0.8"
chatty-wasm-runtime = { path = "../chatty-wasm-runtime" }
parking_lot.workspace = true

[features]
default = ["mcp"]
mcp = ["chatty-core/mcp"]
