[package]
name = "chatty-wasm-runtime"
version.workspace = true
edition.workspace = true
description = "Wasmtime embedding and host-side WIT interface for chatty WASM modules"

[features]
# Test assets for suites that load real modules: `test_support::fixture_path`
# and the scripted `test_support::FakeLlm` (AGE-596).
test-support = []

[dependencies]
wasmtime = { version = "49", features = ["component-model"] }
wasmtime-wasi = "49"
anyhow.workspace = true
bytes.workspace = true
tokio.workspace = true
tracing.workspace = true
serde.workspace = true
serde_json.workspace = true
async-trait.workspace = true

[dev-dependencies]
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tempfile.workspace = true

[[test]]
name = "fixtures"
required-features = ["test-support"]

[[test]]
name = "sandbox"
required-features = ["test-support"]
