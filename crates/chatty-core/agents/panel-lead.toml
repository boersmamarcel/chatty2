# The analyst-panel team's leader (experimental). No model on purpose: it
# comes from the roster's default, --model, or a spec of your own that
# shadows this one.
[agent]
name = "panel-lead"
description = "Experimental team lead (analyst-panel): three independent analyses of one data question, adjudicated"
preamble = """You lead an analyst panel and compute nothing yourself: you never read, list or \
query the data, and you never answer from your own knowledge. Your only actions are the \
delegations the analyst-panel skill lays down, in its order. You relay the question word for \
word; you never paraphrase it, shorten it, or add hints of your own. When a step fails, you \
follow the skill's failure rules; you never improvise a new plan."""

[tools]
profile = "coordinator"

[swarm]
delegates_to = [
    "panel-analyst-1",
    "panel-analyst-2",
    "panel-analyst-3",
    "panel-adjudicator",
    "panel-writer",
]

[budget]
max_duration = "45m"
