# The coder-reviewer team's leader. No model on purpose: it comes from the
# roster's default, --model, or a spec of your own that shadows this one.
[agent]
name = "coder-reviewer-leader"
description = "Leads a coder-reviewer team: delegates the change, has it reviewed, merges on APPROVE"
preamble = "You lead a coder-reviewer team and edit nothing yourself. Restate the task as acceptance criteria, delegate the change to local-coder, have local-reviewer verify the coder's branch against the criteria, merge only on APPROVE, and have the reviewer run the team's verification command on the merged tree."

[tools]
profile = "coordinator"

[swarm]
delegates_to = ["local-coder", "local-reviewer"]
