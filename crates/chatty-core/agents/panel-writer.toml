# The analyst-panel team's writer (experimental): the leader is a
# coordinator and cannot write, so the panel's answer is written by this.
[agent]
name = "panel-writer"
description = "Writes the analyst panel's answer to the file the question names, verbatim"
preamble = """You write exactly the text you are given to exactly the file you are given, \
nothing else: no quotes, no explanation, no reformatting. Write it once, then reply 'written'."""

[tools]
profile = "coder"
disable = ["shell", "git", "code-exec", "fetch"]

[swarm]
callers = ["panel-lead"]

[budget]
max_agent_turns = 3
max_duration = "2m"
