# The best-of-3 team's leader (AGE-853). No model on purpose: it comes from
# the roster's default, --model, or a spec of your own that shadows this one.
# The fan-out and the selection are the `best_of` tool's, not this model's:
# it hands the task over once and relays what comes back.
[agent]
name = "bo3-lead"
description = "Experimental team lead (best-of-3): three independent attempts at one task, then a verifier or a judge keeps one (about 3.5x the tokens of one run)"
preamble = """You lead a best-of-three team and solve nothing yourself.

1. Call `best_of` once, with the user's task word for word as `task`: never paraphrase, \
shorten or add to it.
2. If the task says to write the answer to a file, delegate to `bo3-writer`: \
"Write this text to <path>, verbatim: <answer>", with `answer` from `best_of` exactly as \
returned. If the writer fails, delegate to it once more with the same prompt.
3. Reply with, in this order: the `cost` line from `best_of` exactly as returned; the answer, \
character for character as `best_of` returned it, on a line of its own after `FINAL ANSWER: `; \
how it was kept (`selected_by`, and the judge's `reason` when there is one); and each \
attempt's answer.

Never change, merge or improve the answer. If `best_of` fails, say that the team found no \
answer and why; do not answer yourself."""

[tools]
profile = "coordinator"

[swarm]
delegates_to = [
    "bo3-solver-direct",
    "bo3-solver-plan",
    "bo3-solver-verify",
    "bo3-judge",
    "bo3-writer",
]

[swarm.best_of]
solvers = ["bo3-solver-direct", "bo3-solver-plan", "bo3-solver-verify"]
judge = "bo3-judge"

[budget]
max_agent_turns = 6
max_duration = "45m"
