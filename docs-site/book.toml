[book]
title = "Chatty Documentation"
authors = ["Marcel Boersma"]
description = "User guides, architecture, reference, and contributor docs for Chatty"
language = "en"
src = "src"

[build]
create-missing = false

[output.html]
default-theme = "light"
preferred-dark-theme = "ayu"
git-repository-url = "https://github.com/boersmamarcel/chatty2"
edit-url-template = "https://github.com/boersmamarcel/chatty2/edit/main/{path}"
site-url = "/chatty2/"
additional-css = ["theme/chatty.css"]
additional-js = ["theme/mermaid-init.js"]
no-section-label = true

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30

[output.html.playground]
editable = false
