name: Update next queued PR

# A one-lane merge queue for a personal-account repository, where GitHub's
# merge queue is unavailable. The `protect main` ruleset keeps the strict
# up-to-date policy, so a PR that is behind main cannot merge until its branch
# is updated. This workflow does that press for the PR at the front of the
# queue, and only that one, so CI reruns serialize instead of fanning out.
#
# The queue is "auto-merge armed, not draft, same-repo head", oldest first.
# ship-auto-merge.yml arms auto/* PRs; a human arms anything else with
# `gh pr merge --auto`. Nothing else joins.
#
# Closed-system: the token is a short-lived installation token of the
# hive-nurse GitHub App (secrets NURSE_APP_ID and NURSE_APP_PRIVATE_KEY),
# scoped to this repository with contents + pull-requests write. It replaced
# AUTO_UPDATE_TOKEN, a fine-grained PAT that expired. GITHUB_TOKEN cannot be
# used: branch updates it makes do not trigger CI on the PR, so the refreshed
# head would never go green. pull_request_target runs this file from main and
# checks nothing out, so PR content never reaches the token.

on:
  push:
    branches: [main]
  pull_request_target:
    types: [auto_merge_enabled]
  schedule:
    # Fallback: auto-merge armed by GITHUB_TOKEN (ship-auto-merge) emits no
    # auto_merge_enabled event, and a PR armed while main is quiet would wait.
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-next-queued-pr
  cancel-in-progress: false

jobs:
  update-next:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout main (script only; PR content is never checked out)
        uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: scripts/update-next-queued-pr.sh
          sparse-checkout-cone-mode: false

      - name: Check that the nurse App secrets are set
        env:
          # Only whether each secret is set reaches the shell, never its value.
          HAS_APP_ID: ${{ secrets.NURSE_APP_ID != '' }}
          HAS_APP_KEY: ${{ secrets.NURSE_APP_PRIVATE_KEY != '' }}
        run: |
          if [ "$HAS_APP_ID" != true ] || [ "$HAS_APP_KEY" != true ]; then
            echo "::error::The repository secrets NURSE_APP_ID and NURSE_APP_PRIVATE_KEY must both be set (the hive-nurse GitHub App, installed on this repository)."
            exit 1
          fi

      - name: Mint a short-lived token from the nurse App
        id: nurse-token
        # v3.3.0, pinned by commit. No owner/repositories: the token is
        # scoped to this repository only.
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.NURSE_APP_ID }}
          private-key: ${{ secrets.NURSE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
          permission-checks: read
          permission-statuses: read

      - name: Update the branch of the PR at the front of the queue
        env:
          GH_TOKEN: ${{ steps.nurse-token.outputs.token }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          [ -n "${GH_TOKEN:-}" ] || { echo "::error::The nurse App returned no token; check NURSE_APP_ID and NURSE_APP_PRIVATE_KEY"; exit 1; }

          bash scripts/update-next-queued-pr.sh "$REPO"
