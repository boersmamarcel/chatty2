name: CI

# Required status check is the `test` job. Do not add workflow-level
# `paths` / `paths-ignore` — a skipped workflow fails that check.
# Docs-only (and other non-compile) diffs take the cheap path inside `test`.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  # Merge-queue builds. Required checks must report on merge groups or the
  # queue ejects every entry.
  merge_group:

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      # A merge group has no base to diff against; always take the full
      # compile path there. It is the last gate before main.
      rust: ${{ github.event_name == 'merge_group' || steps.filter.outputs.rust == 'true' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      # Always — grep + decision-table tests, not a compile. Workflow-only
      # PRs must still catch release-pipeline regressions (v0.3.31–v0.3.34).
      - name: Check release authz gates (closed-system)
        run: bash scripts/check-release-authz.sh

      - name: Detect compile-relevant changes
        if: github.event_name != 'merge_group'
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            workflow_scripts:
              - '.github/**'
              - 'scripts/**'
            rust:
              - '**/*.rs'
              - '**/Cargo.toml'
              - '**/Cargo.lock'
              - '**/.cargo/**'
              - 'rust-toolchain'
              - 'rust-toolchain.toml'
              - 'clippy.toml'
              - 'rustfmt.toml'
              - 'modules/**/*.rs'
              - 'modules/**/Cargo.toml'
              - 'modules/**/Cargo.lock'
              - 'modules/**/module.toml'
              - 'modules/fixtures/**'
              # The `cargo generate` scaffold CI builds fresh each run
              # (AGE-600). Not caught by the '**/Cargo.toml' glob alone:
              # `cargo-generate.toml` and `module.toml` here aren't matched by
              # any pattern above, and a change to any of them (or AGE-445's
              # eventual rename) must re-run the build.
              - 'templates/module/**'
              - 'wit/**'
              # Goldens are test inputs: editing one must re-run the tests
              # that replay it (the pre-fabric ones above all, AGE-640).
              - '**/goldens/**'
              - 'scripts/build-wasm-fixtures.sh'
              - 'scripts/check-reserved.sh'
              - 'scripts/check-rig-pins.sh'
              - 'scripts/check-no-core-reexports.sh'
              - 'scripts/check-release-authz.sh'
              - 'scripts/setup-linux.sh'
              # resume_spike_dry_run / rebrief_template_is_frozen (AGE-650)
              - 'scripts/resume-spike/**'
              - 'docs/research/resume-spike-template.md'
              - '.github/workflows/ci.yml'
              - 'Makefile'

      # Gated: AGE-705's decision table is pure bash with no dependency on
      # the rest of the tree, so only run it when a workflow or script
      # actually changed (merge_group has no base to diff, so it always runs
      # there, matching the `rust` output's convention above).
      - name: Test PR nurse decision logic (AGE-705)
        if: github.event_name == 'merge_group' || steps.filter.outputs.workflow_scripts == 'true'
        run: bash scripts/pr-nurse-decide-test.sh

  test:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Skip compile/test (no Rust-relevant changes)
        if: needs.changes.outputs.rust != 'true'
        run: |
          echo "No compile-relevant files changed; skipping toolchain, tests, and clippy."
          echo "The required \`test\` check still reports success."

      - name: Checkout repository
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-wasip2

      - name: Cache cargo registry and build artifacts
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          # v1 retires a cache that a *cancelled* main run saved five minutes
          # into a fresh-key compile (2026-09-03, "Adds chrome support"). An
          # exact hit is never re-saved, so every run since restored that
          # partial target/ and recompiled the missing ~240 crates plus all
          # of clippy's. Bump again if the cache ever needs to be rebuilt.
          prefix-key: v1-rust
          shared-key: linux-ci
          # `modules/benford`, `crates/chatty-module-sdk` and
          # `crates/hive-billing-sdk` each declare their own `[workspace]`
          # (AGE-600): they are not workspace members, so their `target/`
          # dirs live outside `.` and need their own cache entries. The
          # fixtures under `modules/fixtures/*` build into the main
          # workspace's `target/wasm-fixtures/` (see
          # `scripts/build-wasm-fixtures.sh`) and are already covered by `.`.
          workspaces: |
            .
            modules/benford
            crates/chatty-module-sdk
            crates/hive-billing-sdk
          # Deliberately no `cache-on-failure: true`: it also saves on
          # cancelled jobs, and cancel-in-progress above cancels main runs
          # whenever two pushes land close together.

      - name: Install Linux dependencies
        if: needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Build WASM modules and test fixtures (tests load them)
        if: needs.changes.outputs.rust == 'true'
        run: scripts/build-wasm-fixtures.sh

      # cargo-generate isn't preinstalled on GitHub-hosted runners;
      # cargo-binstall fetches its prebuilt binary instead of compiling it.
      - name: Install cargo-binstall
        if: needs.changes.outputs.rust == 'true'
        uses: cargo-bins/cargo-binstall@main

      - name: Install cargo-generate
        if: needs.changes.outputs.rust == 'true'
        run: cargo binstall --no-confirm cargo-generate

      # AGE-600: the plugin path had rotted unnoticed because CI only ever
      # built echo. Generate a plugin from templates/module exactly the
      # way the tutorials tell an author to, then build it, so a change that
      # breaks the template is caught here instead of by the next author.
      # `modules/ci-generated` is git-ignored.
      - name: Generate and build a module from templates/module
        if: needs.changes.outputs.rust == 'true'
        run: |
          rm -rf modules/ci-generated
          cargo generate --path templates/module --name ci-generated \
            --define description=ci --destination modules --silent --no-workspace
          cargo build --manifest-path modules/ci-generated/Cargo.toml \
            --target wasm32-wasip2 --release

      # benford and the SDK crates are standalone (not workspace
      # members) so `cargo test --all-features` below never touches them;
      # both default to `wasm32-wasip2` via their own `.cargo/config.toml`,
      # which has no libtest runner, so the host target must be explicit
      # (AGE-600).
      - name: Test benford on the host target
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --manifest-path modules/benford/Cargo.toml --target x86_64-unknown-linux-gnu

      - name: Clippy chatty-module-sdk for wasm32-wasip2
        if: needs.changes.outputs.rust == 'true'
        run: cargo clippy --manifest-path crates/chatty-module-sdk/Cargo.toml --target wasm32-wasip2 -- -D warnings

      - name: Test hive-billing-sdk on the host target
        if: needs.changes.outputs.rust == 'true'
        run: cargo test --manifest-path crates/hive-billing-sdk/Cargo.toml --target x86_64-unknown-linux-gnu

      # The gateway conformance suite (AGE-599) drives a real third-party
      # client: the MCP Inspector through `npx`, which needs Node >= 22.19.
      # Without it the tests print SKIP and pass without checking anything.
      # (The OpenAI Python client and its `uv` went with the OpenAI routes,
      # PL-U3.)
      - name: Install Node 22 (MCP Inspector for the gateway conformance suite)
        if: needs.changes.outputs.rust == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run tests
        if: needs.changes.outputs.rust == 'true'
        # CI has shown intermittent SIGTRAP in `chatty-core` tests when run in
        # parallel on GitHub-hosted runners; serialize tests for stability.
        # chatty-tui clap --help is covered by `cli_smoke_tests` (no extra
        # `cargo build -p chatty-tui`, which recompiled the bin without cfg(test)).
        run: cargo test --all-features -- --test-threads=1

      - name: Check formatting
        if: needs.changes.outputs.rust == 'true'
        run: cargo fmt --check

      - name: Run clippy
        if: needs.changes.outputs.rust == 'true'
        # --all-features matches the coverage of the test step above; clippy
        # was previously default-features-only, leaving feature-gated code
        # unchecked (AGE-174).
        #
        # --all-targets adds tests, benches and examples. Without it clippy saw
        # only lib/bin targets, so lints in `tests/` were never reported — one
        # had been sitting in chatty-protocol-gateway's e2e test unnoticed.
        run: cargo clippy --all-features --all-targets -- -D warnings

      - name: Check reserved symbols (AGE research)
        if: needs.changes.outputs.rust == 'true'
        run: bash scripts/check-reserved.sh

      - name: Check rig exact-minor pins (AGE-26)
        if: needs.changes.outputs.rust == 'true'
        run: bash scripts/check-rig-pins.sh

      - name: Check no chatty_core re-exports (AGE-177)
        if: needs.changes.outputs.rust == 'true'
        run: bash scripts/check-no-core-reexports.sh

  # The Windows compile, at PR time. `warm-release-cache` below builds Windows
  # too, but only on pushes to main and only on a cache miss, so the first
  # reliable signal was release.yml's build-windows — after the merge, and too
  # late. AGE-339 reached main that way: the broker's participant socket is
  # `#[cfg(unix)]` and both consumers imported it unconditionally, so
  # build-windows failed, upload-assets needs all three platforms, and v0.3.62
  # published with no assets at all.
  # Step-level `if` (not job-level) so the job still reports success on a
  # docs-only PR, the way `test` above does.
  windows:
    needs: changes
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: Skip compile (no Rust-relevant changes)
        if: needs.changes.outputs.rust != 'true'
        run: echo "No compile-relevant files changed; skipping the Windows check."

      - name: Checkout repository
        if: needs.changes.outputs.rust == 'true'
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: windows-ci

      # Desktop app plus the CLI: exactly the crates release.yml's
      # build-windows job builds. `cargo check`, not `cargo build --release` —
      # this gate is about what compiles on Windows, and the release profile's
      # fxc.exe shader pass stays warm-release-cache's job.
      - name: Check the desktop app and the CLI
        if: needs.changes.outputs.rust == 'true'
        run: cargo check -p chatty-gpui -p chatty-tui

  # ADR-0020's first kill criterion (AGE-640, BI-8): the parent-side traces
  # BI-0 recorded from `main` before BI-3 replay unchanged on the new path.
  # `pre_fabric_goldens_replay` already runs inside `test`; this job runs it
  # on its own so the criterion is a named check, and fails a change that
  # rewrites a pre-fabric golden instead of the code (a golden may only be
  # deleted, with a reason in the PR body; see docs/swarm-test-kit.md).
  fabric-goldens:
    needs: changes
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GOLDENS: crates/chatty-tui/src/participant/goldens/pre_fabric
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # HEAD^1 is the base on a PR merge ref, a merge group and a push.
          fetch-depth: 2

      - name: Refuse edited pre-fabric goldens
        run: |
          edited=$(git diff --name-only --diff-filter=MRT HEAD^1 HEAD -- "$GOLDENS")
          if [ -n "$edited" ]; then
            echo "::error::pre-fabric goldens are never re-recorded (ADR-0020 invariant 10):"
            echo "$edited"
            exit 1
          fi

      - name: Skip replay (no Rust-relevant changes)
        if: needs.changes.outputs.rust != 'true'
        run: echo "No compile-relevant files changed; skipping the goldens replay."

      - name: Install Rust toolchain
        if: needs.changes.outputs.rust == 'true'
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry and build artifacts
        if: needs.changes.outputs.rust == 'true'
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: v1-rust
          shared-key: linux-fabric-goldens
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: Install Linux dependencies
        if: needs.changes.outputs.rust == 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config

      # `--test worker_binary` makes cargo build the chatty-tui binary the
      # kit spawns as its workers. The replay must actually run: a renamed
      # or filtered-out test would otherwise pass with 0 tests.
      - name: Replay the pre-fabric goldens
        if: needs.changes.outputs.rust == 'true'
        run: |
          set -o pipefail
          cargo test -p chatty-tui --bin chatty-tui --test worker_binary -- \
            --exact participant::swarm_kit::pre_fabric_goldens_replay --test-threads=1 \
            | tee replay.log
          grep -q "test participant::swarm_kit::pre_fabric_goldens_replay ... ok" replay.log

  # Warm the release-profile caches that release.yml restores. Release runs
  # are restore-only (they must never write default-branch caches), so until
  # this job existed every release built cold on all three platforms. Runs on
  # pushes to main, one runner per release platform, each building exactly
  # what the matching release.yml job builds, and is a no-op when a cache for
  # this Cargo.lock + rustc already exists. The key ignores workspace version
  # bumps (scripts/release-cache-key.sh), so the cache built from pre-bump
  # main is an exact hit on the release tag.
  warm-release-cache:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            build: cargo build --release
          - os: macos-latest
            build: cargo build --release
          # Desktop app + CLI, exactly what release.yml's build-windows packages.
          - os: windows-latest
            build: cargo build --release -p chatty-gpui -p chatty-tui
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Compute release cache key
        id: cache_key
        shell: bash
        run: echo "key=$(bash scripts/release-cache-key.sh)" >> "$GITHUB_OUTPUT"

      - name: Check for an existing release cache
        id: lookup
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache_key.outputs.key }}
          lookup-only: true

      - name: Install Linux dependencies
        if: runner.os == 'Linux' && steps.lookup.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config

      # gpui compiles its HLSL shaders with fxc.exe in release builds; see the script.
      - name: Locate fxc.exe for gpui shader compilation
        if: runner.os == 'Windows' && steps.lookup.outputs.cache-hit != 'true'
        run: ./scripts/find-fxc.ps1
        shell: pwsh

      - name: Build release binary
        if: steps.lookup.outputs.cache-hit != 'true'
        run: ${{ matrix.build }}

      # A plain step, not a post step: a cancelled job never reaches it, so
      # a half-built target/ can never be saved under this key.
      - name: Save release cache
        if: steps.lookup.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ steps.cache_key.outputs.key }}
