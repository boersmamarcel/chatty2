name: Release

# Entry points:
#   1. Called by Prepare Release via workflow_call (primary path)
#   2. Triggered by a published GitHub Release (fallback)
#   3. Manual workflow_dispatch when the published event did not fire
#      (AGE-35 recovery path: rebuild artifacts for an existing tag).
#      MUST be dispatched against the tag ref itself so checkout uses github.sha:
#        gh workflow run release.yml --ref vX.Y.Z -f tag_name=vX.Y.Z
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Git tag to build from (e.g. v1.2.3); must match the workflow ref"
        required: true
        type: string
  workflow_call:
    inputs:
      tag_name:
        description: "Git tag to build from (e.g. v1.2.3)"
        required: true
        type: string
  release:
    types: [published]

env:
  CARGO_TERM_COLOR: always
  APP_NAME: chatty

# Caching policy: restore-only. Release workflows must not write default-branch
# caches (CodeQL cache-poisoning). Warm caches come from CI on main.

jobs:
  # Validate that the tag is immutable, on main, and matches Cargo.toml.
  # workflow_dispatch is owner-only (forks / outsiders must not arm releases).
  validate-version:
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.actor == github.repository_owner
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag_name: ${{ steps.version.outputs.tag_name }}
      git_ref: ${{ steps.version.outputs.git_ref }}
      # Trusted checkout target for build jobs. On workflow_dispatch this is
      # github.sha (workflow was run from the tag); never an input-derived ref.
      checkout_ref: ${{ steps.version.outputs.checkout_ref }}
    steps:
      - name: Resolve tag name
        id: resolve_tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ inputs.tag_name || github.event.inputs.tag_name || '' }}
          RELEASE_TAG: ${{ github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # Never check out from the dispatch input (CodeQL cache-poisoning).
            # Operator must run the workflow FROM the tag ref.
            if [ "$REF_TYPE" != "tag" ]; then
              echo "::error::workflow_dispatch must target the tag ref (gh workflow run --ref vX.Y.Z -f tag_name=vX.Y.Z). Got ref_type=$REF_TYPE ref_name=$REF_NAME"
              exit 1
            fi
            TAG="$REF_NAME"
            INPUT="${INPUT_TAG#refs/tags/}"
            if [ -n "$INPUT" ] && [ "$INPUT" != "$TAG" ]; then
              echo "::error::tag_name input ($INPUT) must match dispatch tag ref ($TAG)"
              exit 1
            fi
            MODE="workflow_sha"
          elif [ "$EVENT_NAME" = "release" ]; then
            TAG="${RELEASE_TAG#refs/tags/}"
            MODE="git_ref"
          else
            # workflow_call from prepare-release
            TAG="${INPUT_TAG#refs/tags/}"
            MODE="git_ref"
          fi

          if [ -z "$TAG" ]; then
            echo "::error::No tag name provided"
            exit 1
          fi
          if ! [[ "$TAG" =~ ^v?[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]]; then
            echo "::error::Invalid tag format: $TAG"
            exit 1
          fi

          echo "checkout_mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "git_ref=refs/tags/$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved tag: $TAG (mode=$MODE)"

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # workflow_dispatch: github.sha is the tag the workflow was run against.
          # workflow_call / release: immutable refs/tags/… only (never a bare name).
          ref: ${{ steps.resolve_tag.outputs.checkout_mode == 'git_ref' && steps.resolve_tag.outputs.git_ref || github.sha }}
          fetch-depth: 0

      - name: Verify tag ref and ancestry on main
        run: |
          set -euo pipefail
          TAG="${{ steps.resolve_tag.outputs.tag }}"
          GIT_REF="refs/tags/${TAG}"

          # Ensure the tag ref exists (fetch tags if checkout was by SHA).
          git fetch origin --tags --force
          if ! git show-ref --verify --quiet "$GIT_REF"; then
            echo "::error::Immutable tag ref $GIT_REF does not exist"
            exit 1
          fi

          git fetch origin main
          TAG_COMMIT="$(git rev-list -n 1 "$GIT_REF")"
          HEAD_COMMIT="$(git rev-parse HEAD)"
          if [ "$HEAD_COMMIT" != "$TAG_COMMIT" ]; then
            echo "::error::Checked-out commit ($HEAD_COMMIT) is not tag $TAG ($TAG_COMMIT)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$TAG_COMMIT" origin/main; then
            echo "::error::Tag $TAG ($TAG_COMMIT) is not an ancestor of origin/main — refusing to build"
            exit 1
          fi
          echo "Tag $TAG ($TAG_COMMIT) is an ancestor of origin/main"

      - name: Extract and validate version
        id: version
        run: |
          set -euo pipefail
          TAG_NAME="${{ steps.resolve_tag.outputs.tag }}"
          GIT_REF="${{ steps.resolve_tag.outputs.git_ref }}"
          MODE="${{ steps.resolve_tag.outputs.checkout_mode }}"

          TAG_VERSION="${TAG_NAME#v}"
          echo "Tag name: $TAG_NAME"
          echo "Tag version: $TAG_VERSION"
          echo "Git ref: $GIT_REF"
          echo "Checkout mode: $MODE"

          CARGO_VERSION=$(grep '^version' Cargo.toml | head -1 | sed 's/.*"\(.*\)".*/\1/')
          echo "Cargo.toml version: $CARGO_VERSION"

          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::Version mismatch! Tag version ($TAG_VERSION) does not match Cargo.toml version ($CARGO_VERSION)"
            echo "::error::Please update Cargo.toml to version $TAG_VERSION before tagging."
            exit 1
          fi

          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "git_ref=$GIT_REF" >> "$GITHUB_OUTPUT"
          if [ "$MODE" = "workflow_sha" ]; then
            # Break CodeQL taint from dispatch input → checkout ref in build jobs.
            echo "checkout_ref=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "checkout_ref=$GIT_REF" >> "$GITHUB_OUTPUT"
          fi
          echo "✅ Version validated: $TAG_VERSION (tag: $TAG_NAME, ref: $GIT_REF)"

  build-linux:
    needs: validate-version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.checkout_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo registry and build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      - name: Restore pdfium library
        uses: actions/cache/restore@v4
        with:
          path: |
            crates/chatty-core/libs
            crates/chatty-gpui/libs
          key: pdfium-linux-${{ hashFiles('crates/chatty-core/build.rs', 'crates/chatty-gpui/build.rs') }}

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            libwayland-dev \
            libvulkan-dev \
            libx11-dev \
            libxcb1-dev \
            libxcb-render0-dev \
            libxcb-shape0-dev \
            libxcb-xfixes0-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxi-dev \
            libgl1-mesa-dev \
            libfontconfig1-dev \
            libasound2-dev \
            libssl-dev \
            pkg-config

      - name: Build release binary
        run: cargo build --release

      - name: Package Linux AppImage
        run: ./scripts/package-linux-appimage.sh

      - name: Verify pdfium is bundled in AppImage
        run: |
          APPIMAGE=$(ls chatty-linux-*.AppImage 2>/dev/null | head -1)
          if [ -z "$APPIMAGE" ]; then
            echo "::error::AppImage not found — packaging step may have failed"
            exit 1
          fi
          # Use squashfs-tools to inspect the AppImage's embedded squashfs directly,
          # without executing the AppImage (which may fail in CI due to FUSE restrictions).
          sudo apt-get install -y squashfs-tools > /dev/null 2>&1
          # Search all squashfs magic candidates and validate each offset by
          # probing with unsquashfs. This avoids false positives from bytes in
          # the ELF runtime while still supporting AppImages that are not
          # strictly page-aligned.
          OFFSETS=$(python3 - "$APPIMAGE" <<'PY'
          import pathlib
          import sys
          
          data = pathlib.Path(sys.argv[1]).read_bytes()
          candidates = set()
          for magic in (b"hsqs", b"sqsh"):
              start = 0
              while True:
                  idx = data.find(magic, start)
                  if idx < 0:
                      break
                  candidates.add(idx)
                  start = idx + 1
          print("\n".join(str(offset) for offset in sorted(candidates)))
          PY
          )
          OFFSET=-1
          for candidate in $OFFSETS; do
            if unsquashfs -ll -o "$candidate" "$APPIMAGE" >/dev/null 2>&1; then
              OFFSET="$candidate"
              break
            fi
          done
          if [ "$OFFSET" -lt 0 ]; then
            echo "::error::Could not locate squashfs section inside AppImage — the file may be corrupted or not a valid AppImage"
            exit 1
          fi
          echo "Found squashfs at offset $OFFSET"
          TMPDIR=$(mktemp -d)
          unsquashfs -d "$TMPDIR" -o "$OFFSET" "$APPIMAGE" usr/lib/libpdfium.so 2>&1
          if [ -f "$TMPDIR/usr/lib/libpdfium.so" ]; then
            echo "✅ libpdfium.so confirmed inside AppImage"
          else
            echo "::error::libpdfium.so not found in AppImage — PDF tools (pdf_to_image, pdf_extract_text, pdf_info) will not work for users"
            exit 1
          fi
          rm -rf "$TMPDIR"

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-x86_64
          path: chatty-linux-*.AppImage

  build-macos-arm:
    needs: validate-version
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.checkout_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo registry and build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      - name: Restore pdfium library
        uses: actions/cache/restore@v4
        with:
          path: |
            crates/chatty-core/libs
            crates/chatty-gpui/libs
          key: pdfium-macos-${{ hashFiles('crates/chatty-core/build.rs', 'crates/chatty-gpui/build.rs') }}

      - name: Build release binary
        run: cargo build --release

      - name: Import code signing certificate
        if: ${{ vars.MACOS_SIGNING_ENABLED == 'true' }}
        env:
          CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate (trap ensures cleanup even on failure)
          trap 'rm -f certificate.p12' EXIT
          echo "$CERTIFICATE_BASE64" | base64 --decode > certificate.p12
          security import certificate.p12 -k "$KEYCHAIN_PATH" -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add keychain to search list
          security list-keychain -d user -s "$KEYCHAIN_PATH"

      - name: Package macOS app
        env:
          SIGNING_IDENTITY: ${{ vars.MACOS_SIGNING_ENABLED == 'true' && secrets.MACOS_SIGNING_IDENTITY || '-' }}
          NOTARIZE_APPLE_ID: ${{ secrets.NOTARIZE_APPLE_ID }}
          NOTARIZE_TEAM_ID: ${{ secrets.NOTARIZE_TEAM_ID }}
          NOTARIZE_PASSWORD: ${{ secrets.NOTARIZE_PASSWORD }}
        run: ./scripts/package-macos.sh

      - name: Verify pdfium is bundled in DMG
        run: |
          DMG=$(ls chatty-macos-*.dmg 2>/dev/null | head -1)
          if [ -z "$DMG" ]; then
            echo "::error::DMG not found — packaging step may have failed"
            exit 1
          fi
          hdiutil attach -readonly -nobrowse -mountpoint /tmp/verify_pdfium "$DMG"
          PDFIUM=$(find /tmp/verify_pdfium -name "libpdfium.dylib" 2>/dev/null | head -1)
          # Always detach before potentially exiting so the volume is never left mounted
          hdiutil detach /tmp/verify_pdfium || true
          if [ -n "$PDFIUM" ]; then
            echo "✅ libpdfium.dylib confirmed inside DMG at: $PDFIUM"
          else
            echo "::error::libpdfium.dylib not found in DMG — PDF tools (pdf_to_image, pdf_extract_text, pdf_info) will not work for users"
            exit 1
          fi

      - name: Clean up keychain
        if: always()
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db
          security delete-keychain "$KEYCHAIN_PATH" || true

      - name: Upload macOS ARM artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-arm64
          path: chatty-macos-*.dmg

  build-windows:
    needs: validate-version
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-version.outputs.checkout_ref }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Restore cargo registry and build artifacts
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-release-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-release-${{ runner.os }}-

      - name: Restore pdfium library
        uses: actions/cache/restore@v4
        with:
          path: |
            crates/chatty-core/libs
          key: pdfium-windows-${{ hashFiles('crates/chatty-core/build.rs') }}

      - name: Build release binary (TUI only — gpui does not support Windows)
        run: cargo build --release -p chatty-tui

      - name: Copy pdfium.dll to release directory for installer
        run: |
          if (Test-Path "crates\chatty-core\libs\lib\pdfium.dll") {
            Copy-Item "crates\chatty-core\libs\lib\pdfium.dll" "target\release\pdfium.dll"
            Write-Host "Copied pdfium.dll to target\release\"
          } else {
            Write-Warning "pdfium.dll not found at crates\chatty-core\libs\lib\pdfium.dll — PDF tools will not work on Windows"
          }
        shell: pwsh


      - name: Copy chatty-tui.exe as chatty.exe for installer
        run: copy target\release\chatty-tui.exe target\release\chatty.exe
        shell: cmd

      - name: Install Inno Setup
        run: choco install innosetup -y

      - name: Create Windows Installer
        run: |
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" /DMyAppVersion=${{ needs.validate-version.outputs.version }} scripts/installer-windows.iss
        shell: pwsh

      - name: Upload Windows Installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-x86_64-setup
          path: scripts/chatty-windows-x86_64.exe

  upload-assets:
    needs: [validate-version, build-linux, build-macos-arm, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Prepare release assets
        run: |
          mkdir -p release-assets

          # Copy Linux AppImage
          if ! cp artifacts/linux-x86_64/*.AppImage release-assets/; then
            echo "::warning::Failed to copy Linux AppImage"
          fi

          # Copy macOS ARM DMG
          if ! cp artifacts/macos-arm64/*.dmg release-assets/; then
            echo "::warning::Failed to copy macOS DMG"
          fi

          # Copy Windows Installer
          if ! cp artifacts/windows-x86_64-setup/*.exe release-assets/; then
            echo "::warning::Failed to copy Windows installer"
          fi

          echo "=== Final release assets ==="
          ls -lah release-assets/

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > checksums.txt
          echo "Generated checksums:"
          cat checksums.txt

      - name: Validate checksums coverage
        run: |
          cd release-assets
          ASSET_COUNT=$(ls -1 | grep -v checksums.txt | wc -l)
          CHECKSUM_COUNT=$(wc -l < checksums.txt)

          echo "Asset files: $ASSET_COUNT"
          echo "Checksums: $CHECKSUM_COUNT"

          if [ "$ASSET_COUNT" -ne "$CHECKSUM_COUNT" ]; then
            echo "::error::Checksum mismatch! $ASSET_COUNT assets but $CHECKSUM_COUNT checksums"
            ls -1 | grep -v checksums.txt
            cat checksums.txt
            exit 1
          fi

          for file in *; do
            if [ "$file" != "checksums.txt" ]; then
              if ! grep -q "$file" checksums.txt; then
                echo "::error::Missing checksum for: $file"
                exit 1
              fi
            fi
          done

          echo "✅ All $ASSET_COUNT assets have checksums"

      - name: Upload assets to release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.validate-version.outputs.tag_name }}
          files: release-assets/*
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
