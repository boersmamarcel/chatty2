name: cargo-deny

# Supply-chain gate (AGE-734): advisories, sources, bans and licenses from
# deny.toml. chatty2 is public, so this runs on GitHub-hosted runners only.
# The required check is the `cargo-deny` job. Do not add workflow-level
# `paths` filters: a skipped workflow fails a required check. The daily run
# surfaces newly published advisories without needing a PR.

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

concurrency:
  group: deny-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  cargo-deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          command: check advisories sources bans licenses
