[module]
name = "{{project-name}}"
version = "0.1.0"
description = "{{description}}"
wasm = "{{project-name | snake_case}}.wasm"

[capabilities]
tools = ["greet"]

[protocols]
# Serve the plugin's tools to external MCP clients at /mcp/{{project-name}}.
mcp = true

[resources]
max_memory_mb = 32
max_execution_ms = 5000

# Optional: string values the plugin reads with `config::get`.
# [config]
# greeting = "hello"

# Optional: the only directory `file::read-bytes` may read, relative to this one.
# [files]
# root = "weights"
